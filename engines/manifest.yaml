  llama-upstream:
    description: >-
      CANDIDATE, NOT IN config.yaml (2026-09-27; docs/ENGINES.md "Flash-Next
      on upstream llama.cpp"). The max tier's model, Qwen3.8-Flash-Next
      (arch qwen4exp: Gated DeltaNet + Qwen Sparse Attention, 512-expert
      MoE, hyper-connections, the PLE n-gram table), which neither of our
      forks can load: PrismML's prism branched from upstream on 2026-08-25
      (merge base 5ea87dda), two days before qwen4exp landed (#27742,
      6c84c7d5d). ggml-org/llama.cpp master at the pin (build 11223; every
      qwen4exp commit through #28770 "CUDA: enable sparse fa for qwen4",
      3cf03257f -- Strata's own pin -- plus a week of master after it) +
      our reasoning-budget nudge (0001 = llama-bonsai2's 0001, same bytes;
      upstream already serves reasoning_budget_tokens/_message per request,
      the nudge is ours). NO MTP (llama-upstream-mtp has it). No PTQ1_0:
      this engine cannot run Bonsai, and the ada engine cannot run this.
    kind: source
    upstream: https://github.com/ggml-org/llama.cpp
    branch: master
    base_commit: 4da6337767f973e2b4d0797e5b323d77d8565e4a
    clone:
      # Blob-less full history: llama.cpp embeds `rev-list --count HEAD`
      # (11223) and the short hash; core.abbrev pins it at 9 ("4da633776").
      # The tree's longest path is 161 characters (tools/ui/...), which fits
      # MAX_PATH under engines_root (52 + 161); a longer --out may not.
      mode: blobless
      abbrev: 9
      autocrlf: true
      keep_git: true
    submodules: {}
    patches:
      - file: 0001-reasoning-budget-nudge.patch
        sha256: 08dbca5a7fa8bcd0583de6383972920354b0aea0fe2d5f12acd95ab08ef646a0
        # OURS: llama-bonsai2's 0001, the same bytes. Applies to this base
        # with offsets only (common.h +1, test-chat.cpp +402,
        # server-schema.cpp +4; checked with git apply --check 2026-09-27).
        # Upstream's own per-request fields (reasoning_budget_tokens,
        # reasoning_budget_message, the _start_tag/_end_tags) are unchanged
        # by it; it adds reasoning_budget_nudge / _nudge_at.
    # NOT TAKEN (2026-09-27): ggml-org/llama.cpp#27902 ("Blackwell IQ
    # Failures", open, 8d78a813): byte loads in get_int_b2 for sm_100-129.
    # Its evidence is CUDA 13.2 (IQ3_S MUL_MAT 0/11 on an RTX PRO 6000);
    # the issue it fixes (#27763) was closed as a CUDA 13.2 toolkit fault
    # (13.0 and 13.3 builds coherent), as was #21289 (13.3 fixed it). We
    # build with 12.8. The IQ2_XS file carries exactly the affected types
    # (IQ2_S x68, IQ3_S x44, IQ1_M x6), so PHASE 2's first step is
    # test-backend-ops MUL_MAT / MUL_MAT_ID on the 5060 Ti (sm_120) for
    # them; a failure there brings the patch in (it applies cleanly here).
