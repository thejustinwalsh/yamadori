        url: https://conda.anaconda.org/nvidia/win-64/cuda-sanitizer-api-12.8.93-0.conda
        sha256: d11712e2fcb88d9bea9bf9d746c98a51b38990548d3968030e99693a9d84d344   # = the channel's repodata
        path: C:/Users/jwals/engines/tools/cuda-sanitizer-api-12.8.93/pkg/Library/compute-sanitizer/compute-sanitizer.exe
        exe_sha256: a245be435b692bc9e9b50b6143d225790fefa6a3fbb3f258dc2347a98ea4bc57
        version: 2025.1.0.0 (build 35583870; the same build id as nvcc 12.8.93)
