      parentless commit (checked 2026-09-29: its tree equals upstream
      d834d44e6's minus 3 files -- benches/dgx-spark/*.log,
      build-xcframework.sh, one Xcode plist -- nothing added or changed);
      fdb1e81 = the whole Mirai change (36 files +3166/-78: the codec on
      CPU and CUDA, ports of Mirai's vLLM plugin mirai_s 0.2.1, Apache-2.0;
      qwen35 split q/gate and ssm_out column order; plus three GENERAL
      changes with env off-switches: GQA-packed FA vec kernel
      GGML_CUDA_FA_VEC_GQA=0, chunked gated-delta-net prefill
      GGML_CUDA_GDN_CHUNKED=0, prompt cache matched by text
