      configure_extra:
        - -DGGML_CUDA=OFF
        - -DBUILD_SHARED_LIBS=OFF
        - -DLLAMA_BUILD_TESTS=ON
      targets: [test-reasoning-budget, test-chat]
      ctest_regex: ^(test-reasoning-budget|test-chat)$
