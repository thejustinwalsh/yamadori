        commit: c8b8993a6211db9edc4df9de9e1f8b1915d183df
      - file: 0034-reasoning-budget-nudge.patch
        sha256: 08dbca5a7fa8bcd0583de6383972920354b0aea0fe2d5f12acd95ab08ef646a0
        # OURS: llama-bonsai2's 0001-reasoning-budget-nudge.patch, the same
        # bytes. Applies to the series with offsets only (8 files, +513/-22);
        # the series' own common/sampling.cpp change (0014, an out-of-vocab
        # guard) does not touch the budget sampler.
      - file: 0035-cuda-fattn-vec-skip-masked-kv.patch
        sha256: 62a94c73ab48a488de48207052aa50ae40860bf22a9ba5bd188684cd56dd3779
        # OURS: llama-bonsai2's 0003, the same bytes; exact (a skipped warp's
        # cells are -inf for every query). On this stack decode with q8_0 K/V
        # and >= 256 KV cells takes the MMA kernel (series 0029), not the
        # vec kernel, so 0035 acts only below 256 cells or with
        # GGML_CUDA_FA_MMA_DECODE_MIN_KV=0 -- kept so that route does not
        # regress to the #59 tax, and so PHASE 2 can compare the two routes
        # in one binary. The MMA kernel still reads masked KV tiles
        # (docs/ENGINES.md "bonsai-ada-surgery merge").
      - file: 0036-spec-draft-window-per-sequence.patch
        sha256: dbafd79b9e391ffa268e53ee70c063c9b7ef222b1522bc59f7fb2bf48f996312
        # OURS (2026-09-27). The series' 0031 trims the draft context of EVERY
        # slot by the batch's lowest position minus --spec-draft-window: with
        # 4 slots a deep conversation's batch erases a shallow one's recent
        # draft rows. Now each sequence in the batch is trimmed by its OWN
        # lowest position in it, and a sequence with no token in the batch is
        # not touched (seq ids read from batch_view.seq_id only). Identical to
        # 0031 with one slot; no effect without --spec-draft-window.
      - file: 0037-tiered-kv-tail-by-pool-cells.patch
        sha256: b94b3b8fad4e42a6dbfd0fa776ca7f4f21e4be23aebfd771f96f5c8c4c965c51
        # OURS (2026-09-27). 0031 drafts --spec-draft-n-max-tail once a
        # slot's POSITION reaches --kv-vram-cells; 0028's line is on pool
        # CELLS. With the unified 4-slot pool every slot's attention spans
        # the pool's highest used cell, so the tail is read by all slots or
        # none: the tail draft size now keys on
        # llama_memory_cells_used_max_p1() (new API: the quantity get_n_kv
        # pads). Draft size only; storage and arithmetic unchanged.
        # (0038 re-keys it on the slot's own span.)
      - file: 0038-kv-cache-attention-spans-the-batch-sequences.patch
        sha256: 985cb8c6d6f09894a73fd033596fc812db1b507289967fbf342556230d7afdd1
        # OURS (2026-09-28, pagoda-h6; docs/ENGINES.md "KV placement"). An
        # attention op spanned the POOL's highest used cell, so an idle
        # sequence parked high made every sequence stage the tiered cache's
        # host tail (0028) on every step. Now n_kv covers the ubatch's own
        # sequences (per-sequence 256-cell block counts in llama_kv_cells;
        # exact: only masked cells leave the view). API
        # llama_memory_seq_span_p1(); the server's tail draft keys on the
        # slot's span. LLAMA_KV_SPAN_BY_SEQ=0 = the pool bound.
      - file: 0039-kv-cache-new-cells-go-to-the-lowest-free-cells.patch
        sha256: 41bc361fc764dfa429e5fd9e9aafe2122c5d9d8cecaa4c4c1a5824900c4bf572
        # OURS (2026-09-28). A sequence grows in place (the cell after its
        # own highest cell), else find_slot starts at the lowest empty cell
        # (a hint, amortised O(1)) instead of the head; not for SWA caches.
        # LLAMA_KV_PLACE_LOW=0 = the head search.
      - file: 0040-kv-cache-promote-the-batch-sequences-to-the-lowest-cells.patch
        sha256: 2b6078cb02e3ee30e82e643642bd6a14fde4ec95123f28253cf255ce7a0a0a45
        # OURS (2026-09-28). Tiered caches only: before a batch whose span
        # would pass the VRAM line, the cells of its sequences move to the
        # lowest cells of the pool and idle sequences' cells move to the
        # lowest empty cells above them: get_rows/set_rows over a raw
        # 32-bit alias of each K/V tensor (bytes, not values), chunks of one
        # ubatch of rows, cells' state swapped after each graph. Sequences
        # used in the last n_seq_max batches never move. Measured: docs/
        # ENGINES.md "KV placement" (bench/kv_placement.py).
        # LLAMA_KV_PROMOTE=0 = off; LLAMA_KV_PROMOTE_VERIFY=1 = byte check.
      - file: 0041-kv-cache-a-slot-rank-decides-whose-cells-hold-the-vram-line.patch
        sha256: 565a04a3ec429a9039ed12b7558b808e6b197205aba7ba1ae6392d3b8a56ba74
        # OURS (2026-09-28, operator: 3 slots, "the first conversation never
        # spills"; docs/ENGINES.md "KV rank"). 0040's plan by RANK: each
        # sequence has a rank (request field `kv_rank`, and `kv_ranks` for
        # the other slots by id; higher keeps VRAM) and an active flag (a
        # slot's task launch to its release). A higher rank keeps its cells
        # running or idle, an equal rank while active; a lower rank moves out
        # first, even running; exchanges take the lowest rank first. The
        # batch's rank groups plan highest first. /props reports
        # `kv_vram_cells`. LLAMA_KV_RANK=0 = 0040 exactly. NOT RUN ON A GPU.
      - file: 0042-server-decide-batch.patch
        sha256: 6338bd58a82938ecd5eea225d1a8311d46dc103302b4acd20d058ff8140036ef
        # OURS (2026-10-07; docs/DECIDE-BATCH.md), UNSHIPPED: no deployed binary has it (`shipped` stays 80d2c60d,
        # `built_with_patches` there ends at 0041) and config.yaml does not pass --decide-seqs. POST /decide-batch:
        # jjava's reads of a call (each question in two option orders) in ONE request. common/decide-batch.{h,cpp}:
        # the shared prefix decoded once on a sequence of its own, every block on a scratch sequence forked from it
        # (llama_memory_seq_cp), the blocks of a wave through llama_decode together, a group's longest common token
        # head decoded once; --decide-seqs N reserves the sequences (one recurrent cell each, ~150 MiB for the
        # 27B: bench/results/a4000/20260930-attempt1 server logs, 149.6 MiB a cell) and needs --kv-unified.
        # The mechanism is ggml-org/llama.cpp's own for its decision models (server_decision_group_tasks,
        # PR #29818 / #29831, MIT). Tests: tests/test-decide-batch.cpp (CPU, tiny hybrid qwen35) in this entry's
        # `tests`, and bench/decide_batch_server_smoke.py (a real llama-server on the CPU). NOT RUN ON A GPU.
