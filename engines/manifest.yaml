# Every inference engine the Yamadori stack runs, pinned: upstream source at
# a full SHA, our patches as files (engines/patches/<engine>/), the inputs a
# build fetches, the toolchain and flags, and the SHA-256 of every file the
# binary we SHIP loads. docs/ENGINES.md explains the fields and the workflow.
#
#   python scripts/build_engine.py --list
#   python scripts/build_engine.py <engine> --jobs 8     # rebuild into a NEW dir
#   python scripts/build_engine.py --verify-only         # what config.yaml runs
#
# scripts/deploy_check.py refuses a deploy whose config.yaml points at a
# binary that is not some engine's `shipped.path`, or whose files do not
# match `shipped.files` (sizes, SHA-256, and no loaded DLL left unpinned).
#
# A rebuild is SOURCE-reproducible, not bit-for-bit (link timestamps, nvcc
# temp names, __FILE__ paths; GGML_NATIVE ties the CPU code to this
# machine). That is why `shipped` records the hash of what runs, not of a
# rebuild. Recorded 2026-09-25 from the files on disk; every value below was
# read from the build trees (CMakeCache.txt, build.ninja, .ninja_log,
# generated sources), not from notes.

schema: 1

defaults:
  # Where build_engine.py builds when --out is not given:
  # <engines_root>/<engine>-<8 hex of the manifest entry + patches>.
  engines_root: C:/Users/jwals/engines

vendoring:
  # The SOURCE we build lives in this repo (operator, 2026-09-29: "carry the
  # actual engine source here"): engines/src/<engine> is the engine's base
  # commit, submodules flattened in, WITH ITS PATCH SERIES APPLIED, minus
  # what its rule below excludes. Each vendored engine's `vendor:` block
  # records the origin and the tree hashes; engines/patches/<engine>/ stays
  # the patch series. docs/ENGINES.md "Vendored source".
  #   python scripts/build_engine.py vendor <engine>        # regenerate (fetches upstream)
  #   python scripts/build_engine.py check [--derive]       # offline proof
  #   python scripts/build_engine.py build <engine>         # offline build
  #   python scripts/build_engine.py update <engine> --to <sha> [--write]
  # `vendor` and `update` keep fetched upstream objects outside the repo, in
  # <engines_root>/.vendor-cache (`cache:` here overrides it).
  # THE EXCLUSION RULE. Paths anchored at the tree root; `dir/` is that
  # directory, `!pat` puts a path back, the last match wins. Only what the
  # CMake build never reads: CI and packaging (.github, .devops, docker),
  # documentation and media, benchmark logs, llama.cpp's tokenizer test
  # vocabularies (models/*.gguf and their .inp/.out vectors; test-chat's
  # models/templates stay), sd.cpp's README images and videos (assets/).
  # A licence or notice file is kept whatever the rule says.
  rules:
    llama.cpp: [.github/, .devops/, docs/, media/, benches/, models/, "!models/templates/"]
    stable-diffusion.cpp: [.github/, docker/, docs/, assets/]

toolchains:
  # The one toolchain every engine here was built with. Nothing was installed
  # for it: VS 2022 Enterprise was present, CUDA is an isolated conda env.
  msvc-cuda128:
    vcvars: C:/Program Files/Microsoft Visual Studio/2022/Enterprise/VC/Auxiliary/Build/vcvars64.bat
    visual_studio: 17.7.7 (Enterprise, 17.7.34302.85)
    msvc:
      # vcvars64 picks 14.36 (Microsoft.VCToolsVersion.v143.default.txt),
      # NOT the newest installed (14.37.32822). Every CMakeCache names 14.36.
      toolset: 14.36.32532
      cl_version: 19.36.32543.0
    windows_sdk: 10.0.22621.0
    cmake:
      path: C:/Program Files/Microsoft Visual Studio/2022/Enterprise/Common7/IDE/CommonExtensions/Microsoft/CMake/CMake/bin/cmake.exe
      version: 3.26.4-msvc4
    ninja:
      path: C:/Program Files/Microsoft Visual Studio/2022/Enterprise/Common7/IDE/CommonExtensions/Microsoft/CMake/Ninja/ninja.exe
      version: 1.11.0
    cuda:
      version: 12.8.93            # nvcc V12.8.93, build cuda_12.8.r12.8/compiler.35583870_0
      root: C:/Users/jwals/textgen/installer_files/cudabuild/Library
      # conda-meta of that env; channel https://conda.anaconda.org/nvidia
      packages:
        cuda-nvcc_win-64: 12.8.93-0
        cuda-nvcc-tools: 12.8.93-0
        cuda-cudart: 12.8.90-0      # provides bin/cudart64_12.dll
        libcublas: 12.8.5.5-h7203ec1_0   # provides bin/cublas64_12.dll, cublasLt64_12.dll
      # A DIAGNOSTIC tool beside the toolchain, NOT part of any build (the operator, 2026-09-29, "yes" to installing
      # compute-sanitizer for the Flash-Next expert-cache fault): NVIDIA's official conda package for the same
      # 12.8 toolkit, extracted (not installed into the cudabuild env).
