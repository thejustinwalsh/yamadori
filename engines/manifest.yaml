      # with whatever `gzip` is on PATH, and gzip's output (and so the
      # embedded UI) depends on it being there at all.
      path: C:/Program Files/Git/usr/bin/gzip.exe
      version: "1.13"

engines:

  # ------------------------------------------------------------------------
  llama-bonsai2:
    description: >-
      The main model's server (`bonsai`, macro server_nudge): sudoingX's
      bonsai2 branch (PR #218 PTQ1_0 kernel + the qwen35 MTP Hadamard fix,
      rebased on prism b10709) plus our reasoning-budget nudge.
    kind: source
    upstream: https://github.com/sudoingX/llama.cpp
    branch: bonsai2
    base_commit: 285542d98d37d0f07f491cd206aefa31f1848f33
    clone:
      # Full commit history (blob-less): llama.cpp embeds `rev-list --count
      # HEAD` (10738) and `rev-parse --short HEAD`. The short hash in THIS
      # build is 9 characters ("285542d98"): the checkout had grown enough
      # objects by 2026-09-25 that git's auto-abbrev chose 9 (the 09-22 build
      # of the same commit embedded 8). core.abbrev pins it.
      mode: blobless
      abbrev: 9
      autocrlf: true
      keep_git: true
    submodules: {}
    patches:
      - file: 0001-reasoning-budget-nudge.patch
        sha256: 08dbca5a7fa8bcd0583de6383972920354b0aea0fe2d5f12acd95ab08ef646a0
        # git diff of the uncommitted working tree against the base, exported
        # read-only 2026-09-25: common/reasoning-budget.{h,cpp},
        # common/common.h, common/sampling.cpp, tools/server/server-schema.cpp,
        # tests/test-reasoning-budget.cpp, tests/test-chat.cpp (+494/-22).
      - file: 0002-cuda-ptq1_0-pdl-sync.patch
        sha256: a2ec297be20837ce8a9fd13993101091111908a66c84cd37a3d269cda52e8007
        # A CORRECTNESS fix, third-party (LamplighterPaul / Paul Zammit),
        # UNMERGED upstream at export. `mul_mat_vec_ptq1_0_pt` is launched
        # through ggml_cuda_kernel_launch, which opts into Programmatic
        # Dependent Launch on sm >= 90 (our 5060 Ti is sm_120; CUDA 12.8
        # under MSVC defines GGML_CUDA_USE_PDL, common.cuh:118-121), but the
        # kernel never called ggml_cuda_pdl_sync(). quantize_q8_1 -- the
        # kernel that writes its q8_1 activations -- fires
        # ggml_cuda_pdl_lc() as its FIRST statement (quantize.cu:63), so the
        # mat-vec could start and read vy before it was written. Reported:
        # output breaks into `!!!!` / `////` a few tokens in on an RTX 5080
        # (sudoingX/bonsai2-small-gpu#3, PrismML-Eng/llama.cpp#218). The fix
        # is one ggml_cuda_pdl_sync() at the top of the kernel, before any
        # read, as mul_mat_vec_q (mmvq.cu:607) does; it compiles to nothing
        # below Hopper (the A4000's sm_86 code is unchanged). Reviewed
        # 2026-09-26: the PR's single commit, parent == our base_commit,
        # 1 file +4/-0, blob baa90977 -> d70ae441; no other kernel launched
        # through ggml_cuda_kernel_launch in this tree lacks the sync.
        # Exported read-only: `gh api repos/sudoingX/llama.cpp/commits/<sha>
        # -H "Accept: application/vnd.github.patch"` (git format-patch form).
        source: https://github.com/sudoingX/llama.cpp/pull/1/commits/967d31271cc3f389fd362dc5cb0f2f9a634dec79
        commit: 967d31271cc3f389fd362dc5cb0f2f9a634dec79
      - file: 0003-cuda-fattn-vec-skip-masked-kv.patch
        sha256: 62a94c73ab48a488de48207052aa50ae40860bf22a9ba5bd188684cd56dd3779
        # OURS (2026-09-27; docs/ENGINES.md "Masked KV cells"). In
        # flash_attn_ext_vec's KV loop a warp whose 32 cells are -inf for
        # every valid query column skips its body: exact (exp(-inf) = 0, the
        # running max unchanged). With the unified 4-slot pool every decode
        # attends up to the highest used cell, so another slot's cells -- or
        # the holes a released slot leaves below the active one -- taxed
        # every token (pagoda-h4: 20-22 tok/s at 16-48k vs h1's 32-34 at the
        # same depth and engine). Measured (n=3 medians, two runs): 32k with
        # an idle 41k slot below, 29.7 -> 41.7; 32k with 3 x 40k above,
        # 17.8 -> 39.9; a lone conversation ~3.5% slower at 32k. Deploy gate
        # 2026-09-27 (bench/engine_corruption.py vs f1ef2064): greedy text
        # identical on ts/bash/prose, 0/16 corruption symptoms, tools 10/10.
    inputs: {}
    toolchain: msvc-cuda128
    # NO WEB UI (operator, 2026-09-25): nothing uses llama-server's own UI
    # (the dashboard is the proxy's /dash). Both switches are needed:
    # LLAMA_BUILD_UI=OFF only skips the npm build -- scripts/ui-assets.cmake
    # still downloads the HF prebuilt while LLAMA_USE_PREBUILT_UI is ON. With
    # both OFF the UI step fetches nothing and embeds an empty asset table
    # (ui.h has no LLAMA_UI_HAS_ASSETS), so the server registers no "/" route.
    path_tools: {}
    absent_tools: [npm, pnpm]
    configure:
      - -DCMAKE_BUILD_TYPE=Release
      - -DGGML_CUDA=ON
      - -DCMAKE_CUDA_ARCHITECTURES=86;120
      - -DLLAMA_CURL=OFF
      - -DLLAMA_BUILD_TESTS=OFF
      - -DLLAMA_BUILD_EXAMPLES=OFF
      - -DLLAMA_BUILD_SERVER=ON
      - -DLLAMA_BUILD_UI=OFF
      - -DLLAMA_USE_PREBUILT_UI=OFF
    expect_cache:
      GGML_NATIVE: "ON"          # the default; see native_cpu
      BUILD_SHARED_LIBS: "ON"
    native_cpu: &native
      GGML_NATIVE: "ON"
      note: >-
        GGML_NATIVE is ON (llama.cpp's default, never set explicitly). Under
        MSVC it probes THIS machine's CPU at configure time; here it resolved
        to /arch:AVX2 with GGML_AVX2, GGML_F16C and GGML_FMA for ggml-cpu (no
        AVX-512). The CPU backend is therefore tied to this machine: a rebuild
        on another CPU can differ, and the binary may not run on a CPU without
        AVX2. The CUDA code is not affected (CMAKE_CUDA_ARCHITECTURES pins it).
      resolved:
        object: ggml-cpu.c.obj
        arch: /arch:AVX2
        defines: [GGML_AVX2, GGML_F16C, GGML_FMA]
    expect_generated:
      common/build-info.cpp:
        sha256: ed5790a0754f5bc6ed0d326322c474e77a366a528651a8ff8c014dec1ababab8
        stage: configure         # number 10738, commit "285542d98", MSVC 19.36.32543.0
    expect_generated_lacks:
