      - file: 0007-moe-cache-multi-token-slot-lookup.patch
        sha256: 543d6d0c4c1cab45337d6cf05fd280c971d36e5f5ded794ed3508ba311e56b1e
        # ours: the cache chain's ids looked up as one flat row (the crash)
      - file: 0008-ggml-cpu-avx2-q2_0-dot.patch
        sha256: d75149130b381fa02744b5422d149d9333c58c444266057f5a1090dd95601528
        # ours: AVX2 ggml_vec_dot_q2_0_q8_0 (0.575 -> 0.118 ms per Flash-Next down layer, moe_cpu_bench, n=300)
      - file: 0009-ggml-cpu-mmid-multi-token-rows-strata.patch
        sha256: 0c6dd7ff0ad86da9aafc7d7596e82b187a5f444146dc4434a40b33e0c4a72723
        # Strata's iq_avx2.cpp @ 3ce2523c (ed14227, pipeob0; MIT notice in the file) + our Q2_0 rows;
        # GGML_CPU_MMID_MT=0/1/2
      - file: 0010-cuda-op-timing-diagnostic.patch
        sha256: a55a21a36e4af100adf54bff612c27b55f0f17951c91febe3c365af7fb4b7b20
        # llama-bonsai2-ada's 0033 (Cary Palmer, MIT: LICENSE.bonsai-ada-surgery) on this base, one hunk at
        # reduced context: GGML_CUDA_OP_TIMING=1 (with GGML_CUDA_DISABLE_GRAPHS=1) prints the per-op GPU time.
        # Diagnostics only, off by default.
      - file: 0011-cuda-top-k-radix-select-without-cub-topk.patch
        sha256: fdbfbd3a4487798113c8082302cf859de3ded23efe487d8da64628068c7b3945
        # ours: GGML_OP_TOP_K by upstream's radix select (written for HIP) when CUB has no DeviceTopK
        # (CCCL < 3.2, CUDA 12.8): the argsort fallback sorted every KV cell per QSA layer per token
        # (#28734). GGML_CUDA_TOPK_RADIX=0 restores it.
      - file: 0012-kv-host-mapped-attention-cache.patch
        sha256: 7a9859cd8b1037aed261d4aff8a0d30c05cf88906284a57a52d683a79f2619c2
        # ours, M3 step 1 (Strata's KV streaming idea, --kv-resident; no Strata code): LLAMA_KV_HOST_MAPPED=1 puts
        # the attention cache's K/V in pinned host memory mapped into the device (a host-mapped twin of the CUDA
        # buffer type); the QSA sparse FA reads the selected cells over PCIe; the indexer cache stays in VRAM
      - file: 0013-moe-cache-mmvq-batch-limit.patch
        sha256: 2e21fb4439d1b7eab9b830176c66fd00106bff5d8d507249923e5278bb86867c
        # ours, the #27861 cache's CUDA fault (M0, 2026-09-30): uncached experts share one zero slot, so a token's
        # slot ids repeat, which MMQ's ids helper does not allow; the cache chain now runs only on batches
        # mul_mat_id serves with MMVQ (<= 7 for IQ2_S on Ampere, 8 on Blackwell). LLAMA_MOE_CACHE_MAX_TOKENS
      - file: 0014-cuda-fa-sparse-convert-selected-cells.patch
        sha256: 133bf131e35e8ba9bfd1324cf5910554db36eeeca41a2bb74980724f0ecfcd47
        # ours (M1): the sparse (QSA) flash attention converted a q8_0 K/V to f16 WHOLE every call; now only the
        # cells the index lists name, on decode-sized batches. GGML_CUDA_FA_SPARSE_ROWS=0 restores it
      - file: 0015-cuda-fa-sparse-decode-quantized-cache.patch
        sha256: b1cd7a59434032ae6f2ea360f80b5cbb8b697c7115affa86069beb0df6c8024e
        # ours (M1): a quantized cache's 1-2 query decode went to the vector kernel (every cell read); it now takes
        # the sparse MMA kernel when the f16 cache would. GGML_CUDA_FA_SPARSE_QUANT=0 restores it
      - file: 0016-moe-cache-hit-rate-at-info.patch
        sha256: 5fd0b605b65614e5c716850efb6dc17f30389fe4381748c7efeb52d1c45c38cd
        # ours: the cache's hit-rate line (every 64 steps, with the last 64's rate) at INFO, shown at -lv 4; it never printed under the strata policy
      - file: 0017-ggml-sched-timing-diagnostic.patch
        sha256: 3352ca622a0ed6382cc19fea9838d4c954655cf7160d70f5fd1897a2a541d56f
        # ours, diagnostic, off by default: GGML_SCHED_TIMING=1 splits each scheduler graph's wall time into waits on a
        # backend, CPU compute, device launch and copies (per 100 graphs at INFO)
      - file: 0018-cuda-fa-sparse-rows-q4_0.patch
        sha256: bc73005149343e9c9459640e0b81aa2f8c5d70a8a5839407687267701bdb6e5a
        # ours: 0014's selected-cell conversion for a q4_0 cache too (the q4kv arm); 4,015/4,015 FLASH_ATTN_EXT cases
        # poisoned on the A4000
      - file: 0022-cuda-mul-mat-id-mmq-src1-padding.patch
        sha256: aa67ddb63c2dd870576bc4e123815302e693de7433bf7e7747544062f1f7eaed
        # upstream bug at 4da63377, ours to fix: mul_mat_id's MMQ padded src1 by ne11 (1 when broadcast) columns, not
        # the tile it picks; a fresh server's first 1,024-token prompt (a 508-token ubatch) read off the VMM pool's
        # end. Independent of 0019-0021 (applies on 0018). test-backend-ops MUL_MAT_ID 932/932 on the 5060 Ti
      - file: 0023-server-checkpoint-every.patch
        sha256: 03f195f66bf32732021385dabe05b6686a3b0e3e192b68d4fe03d7e1b51624a3
        # ours: --checkpoint-every N, a context checkpoint every N prompt tokens (off by default; the deploy passes
        # Strata's 16,384). Live check on the 5060 Ti, 2026-10-02 (bench/flashnext_gate.py step ckpt): a prompt
        # sharing 22,344 tokens with the slot reused 16,384 (0 without the flag), its text equal to a cold run's
      - file: 0029-llama-layer-major-prefill.patch
        sha256: a040f740f91470fc405f1cbd7d6d38a29fe842abf18ef335444b56be2b50726c
        # ours (a Strata-style prompt order, prefill.cpp:752/:855): LLAMA_LAYER_MAJOR=1 runs a prompt batch layer by
        # layer, so each layer's routed experts cross PCIe once per batch (-b), not once per 512-token ubatch (the
        # profile: ~75% of prompt time was that upload). Gate 2026-10-02 at 3 slots, -b 8192, 50 cache rows: ~25.6K
        # prompts 433-439 tok/s vs 154-160 (n=3); KL 0.011379 / 96.458% same top; needles 5/5 @32K; corrupt clean;
        # 0023 restore exact; MTP acceptance unchanged; cancel mid-prompt clean. Decode 4-8% slower (50 rows vs 70).
        # Off unless the switch is set. Rebased onto the shipped series (the author's original sat on 0024-0028).
      # 0019-qwen4exp-qsa-block-topk.patch (sha256 00ff8f19ae0e151312f27fb4cfb88c17052316243f86e9356f6c075893f61562)
      # sits in engines/patches/llama-upstream-flash/ but is NOT in the series yet: the shipped build is 0001-0018, and
      # the vendored source follows the series. It joins the list when a build with it is gated (M2b: needles owed)
      # 0020-llama-graph-cache-per-batch-size.patch (sha256 0ebf732d0f7cfc459bbd8a27a76e075d3dcb2adc6d19f5ed2b0f844c6154cafb),
      # the same: LLAMA_GRAPH_CACHE=N keeps one graph per verify-batch size so ggml-cuda's CUDA graphs replay (A4000, MTP:
      # launches 15.6-18 -> 2.5-3.9 ms a verify step, greedy output identical); joins the series when gated on the 5060 Ti
      # 0030-ggml-staging-ring-for-pageable-expert-uploads.patch (sha256 2b4c44414ba96b24ccf497ffad79b4eeee1409d58eb4a7013f1c7d1039f16844),
      # NOT in the series, NOT pinned, NOT shipped: LLAMA_STAGER=1 (off by default) streams the pageable (unpinned, mmapped) experts
      # of 0029's slot upload through a ring of pinned buffers filled by memcpy threads (Strata's prefill.cpp Stager, MIT,
      # LICENSE.strata) + OS read-ahead; written against the shipped series (0001-0018, 0022, 0023, 0029). Candidate built 2026-10-06 by
      # `build_engine.py build llama-upstream-flash --out llama-upstream-flash-cand0030` from a re-vendored tree (a copy of this manifest
