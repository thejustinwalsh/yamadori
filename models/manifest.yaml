# models/manifest.yaml -- every model file and derived artifact Yamadori loads,
# and the runtimes around them. The engines (llama-server, sd-server builds)
# are engines/manifest.yaml's; this file is the weights and what feeds them.
#
# Checked by scripts/verify_artifacts.py `verify(config_path)` (the deploy
# check calls it): every file config.yaml passes to a model server must be
# recorded here, present, and these bytes. Re-obtained by
# scripts/fetch_models.py. How to re-obtain or rebuild each one, and what
# cannot be: docs/MODELS.md.
#
# A model whose NAME is not already public in the tracked tree goes in
# models/manifest.local.yaml instead (gitignored, same shape, merged at
# verify time).
#
# FIELDS (artifacts)
#   id             unique, kebab-case
#   role           what it does in the stack, in one line
#   status         in_service | disabled (in config.yaml, not served) |
#                  retired (kept for results that used it) |
#                  input (not loaded; an input to a recipe) | candidate
#   config_entries the config.yaml entries that load it (informational;
#                  verify() reads config.yaml itself)
#   loaded_by      config (default: a config.yaml cmd argument) | code (a
#                  Python module opens it; verify() checks it directly)
#   path           ${models} and any other ${macro} expand from config.yaml's
#                  macros; ${repo} is the repository root
#   size           bytes
#   sha256         of the whole file
#   provenance
#     status       pinned     -- an HF repo @ a full commit whose LFS sha256
#                                equals ours (fetch_models.py re-obtains it)
#                  reproduced -- derived; the recipe was re-run and gave these
#                                exact bytes (date in `reproduced`)
#                  recipe     -- derived; recipe recorded, not byte-reproducible
#                                or not re-run
#                  hash_only  -- source unknown; the hash is all we have
#     repo, revision, filename    for pinned (filename as in the repo; the
#                                 local name may differ)
#     revision_basis   why this revision: `download` (the commit current when
#                  the file was fetched, from the file's mtime or a doc) or
#                  `head-at-check` (the repo head on `checked`; the
#                  download-time commit was not recorded)
#     checked      date the HF API was compared with the local sha256
#     licence      from the repo card
#     recipe       tool (repo @ commit, path), engine, inputs by id + sha256,
#                  command, notes
#   format         optional: e1-head (verify() also checks the head's own
#                  W_sha256 and that state.json serves this version)
#   severity       optional: what a mismatch is (default error)
#
# FIELDS (runtimes)
#   check: lock (interpreter + lock file) | buildinfo (web/dist vs source) |
#          version (binary --version and sha256) | files | git (commit + a
#          clean tree, line endings aside)
#   severity: error blocks a deploy; warn is drift around the stack

