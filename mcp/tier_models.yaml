# ONE MODEL PER EFFORT TIER -- the table's one place (loader: mcp/tier_models.py; the swaps: mcp/max_mode.py).
#
# The operator (2026-09-29): "If we get clean swaps and a decider on each model that actually works, we should make
# mirai xhigh flash-next max, and bonsai everything else. These models seem to do better on one reasoning level, so
# we pick the best reasoning level and capability is now the model swap." And, for the profiles: "Token settings,
# thinking efforts, etc. Are all going to need to be really dialed in from the research we have ... it is mostly
# about tuning how big of a turn we allow, and what the thinking budget should be. This is stuff the user and the
# harness will just get wrong, the proxy makes this atomic agent style, no thinking just solid work coming out of
# the box."
#
# READ ONLY WHEN YAMADORI_TIER_MODELS NAMES THIS FILE (bench/deploy_tier_models.py sets it for the proxy, the tools
# API and the worker). Unset, the stack runs one model and nothing below applies.
#
# Every profile value carries its CLASS (AGENTS.md "Claims carry their evidence"):
#   operator     an operator decision, quoted with its date
#   measurement  a script and its n (ours, or the source repo's, named)
#   vendor       the model's card, at a pinned commit, until a measurement replaces it
#   derived      from a real constraint, the derivation beside it
# A key a model does not set falls back to today's constant in mcp/tiers.py (tier_models.defaults()).
#
# Sources pinned here:
#   professorpalmer/bonsai-ada-surgery @ 5158a8df3bc4c8b9375ed521021eb6118feda78d (2026-09-27): the last Bonsai tune
#     (the operator's "Fresh bonsai tune incoming!!!", 2026-09-27)
#   sudoingX/bonsai2-small-gpu @ 1d6c7ec03cdd86c801782a3d39024edd961d8822 (2026-09-28): secondary evidence only
#   Qwen/Qwen3.8-27B @ 1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0 (the base Mirai S quantises; README "Best Practices")
#   trymirai/Qwen3.8-27B-S-experimental @ 32d4c0422a14353808659f2f2333b207bc1dd12a (Mirai's card)
#   Qwen/Qwen3.8-Flash-Next @ de4b8e4d43b917e7706784d8bb445c9af86a3540 (README "Best Practices")

version: 1
default: bonsai

# Every tier not named here is the default model's (minimal, low, medium, high -> bonsai).
#
# SWAP ORDER (operator decision, 2026-09-29, verbatim: "swap order is fine"): max > xhigh > the Bonsai tiers. A
# higher tier's request waits for lower-tier work and never cancels it, then takes the card; a lower tier's request
# gets 503 model_at_capacity with Retry-After while a higher one holds it (mcp/max_mode.py decide / wait_ready).
tiers:
  xhigh: mirai-s
  max: flash-next

models:
  bonsai:
    # Its window is its own served /props (mcp/budget.py: the cap layout, YAMADORI_MAIN_CAP), as before.
    # LOCKED, like flash-next (operator, 2026-09-30, "2. Yes"): jjava and side calls on bonsai-a4000, the main card
    # -np 1 with no lane. Evidence, bench/kv_rank.py --layout v3 lane3 (bench/results/kv_rank/20260930-v3, n=3): a
    # jjava burst on the lane cut main's decode ~30% at 8K/32K/64K (73.8 -> 51.3, 72.7 -> 52.4, 73.0 -> 51.0 tok/s).
    # Compactions stay here, on the conversation's own slot (max_mode.decide, the one exception).
    locked: true
    helpers:
      decider: bonsai-a4000
      side_calls: bonsai-a4000
    # THE OTHER CARD (operator, 2026-09-30: "a second message that came in out of order got the other card"): a
    # conversation whose id is not the card's owner, inside the owner's 60 s hold, runs here for its life
    # (mcp/slots.py THE OTHER CARD). flash-next and mirai-s have none: their newcomer is refused 503, never
    # downgraded (max_mode.other_card; the switch YAMADORI_OTHER_CARD_DOWNGRADE).
    other_card: bonsai-a4000
    # THE TUNE: professorpalmer/bonsai-ada-surgery @ 5158a8df (the operator's "Fresh bonsai tune incoming!!!",
    # 2026-09-27; our engine llama-bonsai2-ada comes from it). sudoingX/bonsai2-small-gpu @ 1d6c7ec is secondary
    # evidence only (coordinator's correction, 2026-09-29).
    profile:
      effort:
        value: medium
        class: measurement
        source: >-
          bonsai-ada-surgery@5158a8df start-server.ps1:70 (BONSAI_EFFORT default medium) and docs/QUALITY.md section 2:
          Killy's HumanEval grid -- medium beats thinking-off from a 2k cap up and beats low and xhigh at every cap,
          160-161 of 164 at 8k-uncapped (README: medium 161/164 replayed on their server). Secondary: sudoingX
          kernel/reasoning_effort.md (greedy, 3 tasks x 2 caps x 2 runs: xhigh ran away inside <think>, medium
          finished). Agrees with tiers.TIERS (operator 2026-09-23).
      user_turn_thinking:
        value: 20480
        class: measurement
        source: >-
          bonsai-ada-surgery@5158a8df start-server.ps1:73 (BONSAI_THINK_BUDGET 20480) and docs/QUALITY.md:138 ("first
          cap in his table where medium wins"; Killy's MBPP medium 35.44 -> 42.22 at 10,224 -> 20,488). Adopted by the
          operator 2026-09-27 ("Yes bump user turn, and I trust their numbers more than ours"). Their grid caps the
          TOTAL output; ours force-closes thinking with the answer room separate (docs/ENGINES.md).
      agent_step_thinking:
        value: 6144
        class: operator
        source: >-
          operator 2026-09-25 ("this model overthinks pretty quickly"; tiers.AGENT_STEP_THINKING); h4's agent steps
          median 128, p90 3,737 reasoning tokens. DIFFERS from bonsai-ada-surgery@5158a8df, whose agents run with
          thinking OFF (docs/QUALITY.md:142-146: write_file at medium spent 10-17k thinking; off parsed 8/9 vs 6/9) --
          not taken: thinking off exfiltrated 5/5 in our injection test (config.yaml, n=5), the operator's call.
      nudge_at:
        value: 0.6
        class: operator
        source: "operator 2026-09-25 (tiers.NUDGE_AT, was 0.8). bonsai-ada-surgery has no nudge (our engine patch 0001)."
      answer_tokens:
        value: 2048
        class: operator
        source: >-
          tiers.A_MIN: the answer allowance reserved beside the thinking budget; the turn's max_tokens is the whole
          room the window leaves, so the answer itself is never cut by it. The client's max_tokens no longer sizes it
          (operator 2026-09-29: "This is stuff the user and the harness will just get wrong").
      turn_min_tokens:
        value: 24576
        class: measurement
        source: >-
          bonsai-ada-surgery@5158a8df start-server.ps1:89 (--reasoning-max-tokens-floor = the think budget + 4096 =
          24,576) and :171 (-n 24576); docs/QUALITY.md:150-162 ("Client max_tokens counts thinking ... Chat needs
          max_tokens >= 20k when thinking is on"; bench/reason_ab.py, 4 SVG + 1 code task: a 4,096 cap blanked 4/4 at
          low and xhigh). The proxy applies it as the turn's floor; the turn is otherwise the whole room the window
          leaves. (sudoingX's README says >= 8,192 for code.)
      force_close:
        value: "\n\nThinking budget reached. I will stop deliberating and write the final answer now.\n"
        class: operator
        source: >-
          tiers.BUDGET_MESSAGE (operator 2026-09-25: "the original text ... seemed to work better"; 2 of 2 clean
          closes; kept 2026-09-27 when only the user-turn row of docs/ENGINES.md's merge proposal was applied).
          DIFFERS from bonsai-ada-surgery@5158a8df start-server.ps1:75 ("Now produce the complete answer."); ours
          follows the nudge's converging summary (engine patch 0001), which theirs has no counterpart for.
      sampling_thinking:
        value: {temperature: 1.0, top_p: 0.95, top_k: 20, min_p: 0.0, presence_penalty: 0.0, repeat_penalty: 1.0}
        class: vendor
        source: >-
          bonsai-ada-surgery@5158a8df start-server.ps1:189-191 (--temp 1.0 --top-p 0.95 --top-k 20) and
          docs/QUALITY.md:193 ("the recommended temp 1.0 / top-p 0.95 / top-k 20"); = Qwen/Qwen3.8-27B@1d4bf0f2
          thinking mode (min_p 0, presence 0, repetition 1.0); operator: temperature stays 1.0.
      sampling_instruct:
        value: {temperature: 0.7, top_p: 0.80, top_k: 20, min_p: 0.0, presence_penalty: 1.5, repeat_penalty: 1.0}
        class: vendor
        source: >-
          Qwen/Qwen3.8-27B@1d4bf0f2 non-thinking mode (bonsai-ada-surgery states none; sudoingX
          results/MODEL_CARD.md:85 quotes the same values).
      job_caps:
        value: true
        class: operator
        source: "tiers.JOB_THINKING / HELPER_THINKING (operator 2026-09-25, 1.5x)"

  # MIRAI S AND FLASH-NEXT: NO BORROWED OR ARBITRARY CAPS (operator, 2026-09-29, verbatim: "they need to be based on
  # what makes them perform the best and how much memory we have, so if we cap them and it gives us bad signal it
  # poisons the entire point of offering more capable models"). Until bench/tier_effort.py measures them, each
  # budget is bounded ONLY by memory -- the budget rule applied to the model's own window:
  #     window    = this row's window.main_cap (derived below from its -c and the decider lane)
  #     thinking  = window - prompt - answer          (tiers.budget; never below MIN_THINKING)
  #     max_tokens = window - prompt                  (the turn is the whole room the window leaves)
  # No number is chosen: `null` means "the window decides".
  mirai-s:
    # WHERE ITS JJAVA AND SIDE CALLS RUN: the lane step decides (bench/mirai_s_gate.py step `lane`: main decode with
    # the lane KEPT / ACTIVE / CLEARED, n=3). "self" = the main card's lane until then; `bonsai-a4000` if the lane
    # measures material (then -np 1 and `locked: true`, as flash-next).
    locked: true
    helpers:
      decider: bonsai-a4000
      side_calls: bonsai-a4000
    # Written by bench/deploy_tier_models.py from the gate's fit (the same -c it writes into config.yaml).
    window:
      ctx: 125952
      slots: 1
      main_cap: 125952
      source: >-
        derived: config.yaml `mirai-s` -c 125952 (bench/mirai_s_gate.py's fit) -np 1 --kv-unified,
        written by tier models (bench/deploy_tier_models.py); -np 1 (the gate's lane step: the lane is material), no lane: the main cap
        is the whole pool with the line = the whole pool (no tiered KV cache on this engine)
    # Written by the deploy: true when the llama-swap entry carries --mmproj; false sends images to bonsai-vision on
    # the A4000 (layout v2's rule for the main card: "the point is to get more context at speed in vram").
    vision: false
    profile:
      effort:
        value: xhigh
        class: vendor
        source: >-
          Qwen/Qwen3.8-27B@1d4bf0f2 README: "xhigh (default): complex tasks requiring thorough analysis; medium:
          balances accuracy and speed; low: optimizes for speed and cost" -- the card's default, NOT a measurement on
          Mirai S. bench/tier_effort.py (uncapped, n named) replaces it.
      user_turn_thinking:
        value: 12288
        class: operator
        source: >-
          operator, 2026-10-02, verbatim: "We should have a thinking budget just like the other models, use what we use scales for the tokens we allow." and "Qwen overthinks so don't let it go forever." (a max turn could think for the whole window: ~1.5 h to the nudge, ~2.6 h to the hard stop at 28 tok/s).
          DERIVED: bonsai's cap 20,480 x this model's window / bonsai's window = 20,480 x 125,952 /
          209,920 = 12,288 (floor). bench/tier_effort.py's curve replaces it when measured.
      agent_step_thinking:
        value: 3686
        class: operator
        source: >-
          operator, 2026-10-02, verbatim: "We should have a thinking budget just like the other models, use what we use scales for the tokens we allow." and "Qwen overthinks so don't let it go forever." (a max turn could think for the whole window: ~1.5 h to the nudge, ~2.6 h to the hard stop at 28 tok/s).
          DERIVED: bonsai's cap 6,144 x this model's window / bonsai's window = 6,144 x 125,952 /
          209,920 = 3,686 (floor). bench/tier_effort.py's curve replaces it when measured.
      answer_tokens:
        value: 2048
        class: derived
        source: >-
          the room reserved for the answer beside the thinking budget = the generation floor the proxy's own window
          check already enforces (proxy.check_client_prompt / GENERATION_FLOOR: a prompt that leaves less than
          tiers.A_MIN of answer is refused 400 context_length_exceeded), so every admitted prompt has it. It bounds
          where the force-close lands, not the answer: max_tokens is the whole room. bench/tier_effort.py records
          each answer's natural length; a measured value replaces this.
      turn_min_tokens:
        value: null
        class: derived
        source: "memory only: the turn is the whole room the window leaves (no chosen floor)"
      sampling_thinking:
        value: {temperature: 1.0, top_p: 0.95, top_k: 20, min_p: 0.0, presence_penalty: 0.0, repeat_penalty: 1.0}
        class: vendor
        source: "Qwen/Qwen3.8-27B@1d4bf0f2 thinking mode (Mirai's card gives none)"
      sampling_instruct:
        value: {temperature: 0.7, top_p: 0.80, top_k: 20, min_p: 0.0, presence_penalty: 1.5, repeat_penalty: 1.0}
        class: vendor
        source: "Qwen/Qwen3.8-27B@1d4bf0f2 non-thinking mode"
      job_caps:
        value: false
        class: operator
        source: "operator 2026-09-29: no borrowed caps -- Bonsai's second-brain caps (derived on Bonsai) do not apply"

  flash-next:
    # LOCKED (operator, 2026-09-30, verbatim: "Agree, no jjava slowing down this highly tuned masterpiece, it stays
    # locked in once it is swapped, and we gotta get that speed!"). Evidence: in Flash-Next's lane step main decode
    # fell to 1.45 tok/s while jjava read on slot 1 (n=1; each cleared-lane burst re-reads ~3k tokens at ~150 tok/s
    # prompt speed, sharing the batch with main). So the card runs ONE conversation slot and nothing else: -np 1, no
    # lane; jjava (the decider, the skills injector, the Jev API) and the client's side calls (titles, summaries) run
    # on `bonsai-a4000`, REQUIRED for max; no warm, slot read, decider or side call touches the card while it holds
    # it (max_mode.locked / touch_allowed).
    locked: true
    helpers:
      decider: bonsai-a4000
      side_calls: bonsai-a4000
    # THE EXPERT FILE IS PRE-READ into the OS file cache (mcp/preread.py): the experts are mmapped and demand-paged
    # (LLAMA_PIN_EXPERTS=0), so the first prompt after a load -- or after a long idle that trimmed the server's working
    # set -- read 31.5-31.9 GB at ~0.4 GB/s (ttft 201-211 s cold vs 83-103 s after a sequential read of shard 1, 17 s;
    # bench/fn_first_prompt.py, bench/results/fn_first_prompt/20261006-a, n=3 per arm). Shard 1 only.
    preread: true
    window:
      ctx: 262144
      slots: 1
      main_cap: 262144
      source: >-
        derived: config.yaml `flash-next` -c 262144 (bench/deploy_flash_next.py, the gate's fit) at -np 1 (locked:
        one conversation, no lane) -- the whole pool is the conversation's, and the slot's window is capped at the
        trained 262,144 (server-context.cpp), so the cap is 262,144
    vision: true
    profile:
      effort:
        value: xhigh
        class: vendor
        source: >-
          Qwen/Qwen3.8-Flash-Next@de4b8e4d README: xhigh is the default effort (docs/FLASH-NEXT.md section 3; the
          llama-swap filter's default too). NOT a measurement; bench/tier_effort.py (uncapped) replaces it.
      user_turn_thinking:
        value: 25575
        class: operator
        source: >-
          operator, 2026-10-02, verbatim: "We should have a thinking budget just like the other models, use what we use scales for the tokens we allow." and "Qwen overthinks so don't let it go forever." (a max turn could think for the whole window: ~1.5 h to the nudge, ~2.6 h to the hard stop at 28 tok/s).
          DERIVED: bonsai's cap 20,480 x this model's window / bonsai's window = 20,480 x 262,144 /
          209,920 = 25,575 (floor). bench/tier_effort.py's curve replaces it when measured.
      agent_step_thinking:
        value: 7672
        class: operator
        source: >-
          operator, 2026-10-02, verbatim: "We should have a thinking budget just like the other models, use what we use scales for the tokens we allow." and "Qwen overthinks so don't let it go forever." (a max turn could think for the whole window: ~1.5 h to the nudge, ~2.6 h to the hard stop at 28 tok/s).
          DERIVED: bonsai's cap 6,144 x this model's window / bonsai's window = 6,144 x 262,144 /
          209,920 = 7,672 (floor). bench/tier_effort.py's curve replaces it when measured.
      answer_tokens:
        value: 2048
        class: derived
        source: "as mirai-s: the generation floor proxy.check_client_prompt enforces; max_tokens is the whole room"
      turn_min_tokens:
        value: null
        class: derived
        source: "memory only: the turn is the whole room the window leaves"
      sampling_thinking:
        value: {temperature: 1.0, top_p: 0.95, top_k: 20, min_p: 0.0, presence_penalty: 0.0, repeat_penalty: 1.0}
        class: vendor
        source: "Qwen/Qwen3.8-Flash-Next@de4b8e4d (docs/FLASH-NEXT.md section 3: 1.0 / 0.95 / 20 / 0 / 0 / 1.0)"
      job_caps:
        value: false
        class: operator
        source: "operator 2026-09-29: no borrowed caps (and 2026-09-28: max follows the card)"

  # THE SECOND BONSAI ON THE A4000 (not a tier's model: a helper). REQUIRED for bonsai's tiers and for max (both
  # LOCKED, operator 2026-09-30: their jjava and side calls run here), and the home of every tier's jjava and side
  # calls whose lane step measures material. Never a compaction's (it stays on its conversation's card). The
  # original trunk (as bonsai-vision), -np 2 (the proxy sends it no slot id: it picks its own, by similarity),
  # gpu_room-managed (SIZES `bonsai-a4000`): it evicts bonsai-vision and imagegen for its room and keeps embeddings
  # (its fit was measured with the reranker resident too; the reranker was removed 2026-10-01).
  # config.bonsai-a4000.fragment.yaml; deployed by bench/deploy_tier_models.py.
  bonsai-a4000:
    # From its fit: bench/a4000_fit.py (bench/results/a4000/20260930, one fit) -c 141,312; bench/deploy_tier_models.py
    # --a4000-fit writes it here (the same values). An internal job routed here is budgeted against it and refused,
    # with its sizes, when it cannot fit (tiers.window_model_of, model.fit_window).
    window:
      ctx: 141312
      slots: 2
      main_cap: 138240
      source: >-
        measured: bench/a4000_fit.py (jjava + side calls as its load), written by tier models (bench/deploy_tier_models.py)
    vision: false
    profile:
      job_caps:
        value: true
        class: operator
        source: "tiers.JOB_THINKING / HELPER_THINKING: the same Bonsai as the default model"
